<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-label="Cloud E-Learning Hub: Full-stack desktop architecture. Education management system with real-time state sync, built in C# / WPF / XAML on a Firebase cloud backend."><title>Cloud E-Learning Hub: Full-stack desktop architecture. Education management system with real-time state sync, built in C# / WPF / XAML on a Firebase cloud backend.</title><style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(var(--h,300px))}}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
.f{opacity:0;animation:fade .8s ease-out both}
.r{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.cur{animation:blink 1s step-end infinite}
.live{animation:pulse 1.6s ease-in-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
.scan{animation:scan 5s linear infinite}
</style><defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#1d2a36" stroke-width=".6" opacity=".55"/></pattern><linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".09"/></linearGradient></defs><rect x="6" y="6" width="428" height="218" rx="10" fill="#0b0f14" stroke="#1d2a36"/><rect x="6" y="6" width="428" height="218" rx="10" fill="url(#grid)"/><path d="M16 6H76" stroke="#00e5ff" stroke-width="2"/><text x="24" y="32" font-size="11" fill="#00e5ff" letter-spacing="1.5">// SYS-02</text><circle cx="410" cy="28" r="4" fill="#3fb950" class="live"/><text x="400" y="32" font-size="9.5" fill="#3fb950" text-anchor="end">DEPLOYED</text><text x="24" y="66" font-size="20" font-weight="700" fill="#e6edf3" class="r" style="animation-delay:0.25s">Cloud E-Learning Hub</text><text x="24" y="86" font-size="11" fill="#00e5ff" class="r" style="animation-delay:0.35s">Full-stack desktop architecture</text><text x="24" y="114" font-size="11" fill="#7d8b99" class="f" style="animation-delay:0.50s">Education management system with real-time state sync,</text><text x="24" y="131" font-size="11" fill="#7d8b99" class="f" style="animation-delay:0.58s">built in C# / WPF / XAML on a Firebase cloud backend.</text><g class="r" style="animation-delay:0.75s"><rect x="24" y="184" width="32" height="20" rx="10" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="40.0" y="198" font-size="10" fill="#00e5ff" text-anchor="middle">C#</text></g><g class="r" style="animation-delay:0.85s"><rect x="64" y="184" width="39" height="20" rx="10" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="83.5" y="198" font-size="10" fill="#00e5ff" text-anchor="middle">WPF</text></g><g class="r" style="animation-delay:0.95s"><rect x="111" y="184" width="74" height="20" rx="10" fill="none" stroke="#00e5ff" stroke-opacity=".5"/><text x="148.0" y="198" font-size="10" fill="#00e5ff" text-anchor="middle">Firebase</text></g><rect x="8" y="0" width="424" height="40" fill="url(#scanG)" class="scan" style="--h:230px;animation-delay:2.5s"/></svg>