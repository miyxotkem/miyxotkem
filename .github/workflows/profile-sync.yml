name: Generate Profile Metrics and Snake

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # 1. Lowlighter Metrics
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          output_action: branch
          committer_branch: output
          committer_message: "build: update achievements [skip ci]"

      - name: Generate General Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          output_action: branch
          committer_branch: output
          committer_message: "build: update stats [skip ci]"

      - name: Generate Languages Breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          output_action: branch
          committer_branch: output
          committer_message: "build: update languages [skip ci]"

      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: branch
          committer_branch: output
          committer_message: "build: update isocalendar [skip ci]"

      - name: Generate Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Ho_Chi_Minh
          output_action: branch
          committer_branch: output
          committer_message: "build: update habits [skip ci]"

  # 2. Contribution Snake
  snake:
    runs-on: ubuntu-latest
    needs: metrics
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Recent Activity Telemetry
  recent-activity:
    runs-on: ubuntu-latest
    needs: snake
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update live system logs [skip ci]"
          MAX_LINES: 5
