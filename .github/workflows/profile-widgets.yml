name: Generate Profile Widgets (Snake + Metrics)

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Snake contribution animation (unchanged from your existing setup) ──
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: miyxotkem
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ── Stats card (replaces github-readme-stats.vercel.app "Stats") ──
      - name: Generate metrics-stats.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: miyxotkem
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Ho_Chi_Minh
          output_action: none
          filename: dist/metrics-stats.svg

      # ── Top languages card (replaces github-readme-stats "Languages") ──
      - name: Generate metrics-languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: miyxotkem
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          output_action: none
          filename: dist/metrics-languages.svg

      # ── Achievements (replaces the broken github-profile-trophy) ──
      - name: Generate metrics-achievements.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: miyxotkem
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          output_action: none
          filename: dist/metrics-achievements.svg

      # ── Isometric contribution calendar (replaces github-readme-3d-contrib) ──
      - name: Generate metrics-isocalendar.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: miyxotkem
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none
          filename: dist/metrics-isocalendar.svg

      # ── Push everything (snake + metrics) to the "output" branch in one go ──
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
