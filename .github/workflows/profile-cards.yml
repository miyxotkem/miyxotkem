name: Refresh profile cards

# Re-draws the animated SVG cards in cards/ from real contribution data.
# Runs daily, on every push to main, and on demand from the Actions tab.

"on":
  schedule:
    - cron: "23 1 * * *"   # ~08:23 in Vietnam (UTC+7)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
