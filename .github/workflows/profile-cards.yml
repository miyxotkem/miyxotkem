name: Refresh profile cards

# Re-draws the animated SVG cards in cards/ from real contribution data.
# Runs every hour, on every push to main, and on demand from the Actions tab.

"on":
  schedule:
    - cron: "17 * * * *"   # hourly, at :17 (runs on the hour are the most delayed)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional: your token, so private repos count too
          WORDS_INCLUDE_PRIVATE: "1"   # words card: also count commit messages from private repos (own and org)
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cards README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
