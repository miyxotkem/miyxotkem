<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" fill="none">
    <defs>
        <style>
            .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #00e5ff; }
            .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
            .val-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
            .pct-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #00e5ff; }
            .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-style: italic; fill: #6e7681; }
        </style>
        <linearGradient id="bar_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#58a6ff" />
            <stop offset="100%" stop-color="#00e5ff" />
        </linearGradient>
    </defs>

    <!-- Background card matching lowlighter/metrics classic theme -->
    <rect x="0.5" y="0.5" width="479" height="259" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(16, 16)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="#00e5ff">
            <path fill-rule="evenodd" d="M1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0zM8 0a8 8 0 100 16A8 8 0 008 0zm.5 4.75a.75.75 0 00-1.5 0v3.5a.75.75 0 00.375.65l2.5 1.5a.75.75 0 00.75-1.3L8.5 7.96V4.75z"/>
        </svg>
        <text x="24" y="13" class="header-text">Recent coding habits</text>
    </g>

    <!-- Habit Row 1: Early bird -->
    <g transform="translate(16, 52)">
        <text x="0" y="12" class="label-text">🌅 Early bird (06:00 - 12:00)</text>
        <text x="448" y="12" class="pct-text" text-anchor="end">28%</text>
        <rect x="0" y="20" width="448" height="6" rx="3" fill="#21262d"/>
        <rect x="0" y="20" width="125" height="6" rx="3" fill="url(#bar_grad)"/>
    </g>

    <!-- Habit Row 2: Day worker -->
    <g transform="translate(16, 92)">
        <text x="0" y="12" class="label-text">☀️ Day worker (12:00 - 18:00)</text>
        <text x="448" y="12" class="pct-text" text-anchor="end">48%</text>
        <rect x="0" y="20" width="448" height="6" rx="3" fill="#21262d"/>
        <rect x="0" y="20" width="215" height="6" rx="3" fill="url(#bar_grad)"/>
    </g>

    <!-- Habit Row 3: Night owl -->
    <g transform="translate(16, 132)">
        <text x="0" y="12" class="label-text">🌙 Night owl (18:00 - 00:00)</text>
        <text x="448" y="12" class="pct-text" text-anchor="end">24%</text>
        <rect x="0" y="20" width="448" height="6" rx="3" fill="#21262d"/>
        <rect x="0" y="20" width="108" height="6" rx="3" fill="url(#bar_grad)"/>
    </g>

    <!-- Details -->
    <g transform="translate(16, 185)">
        <text x="0" y="0" class="label-text">⚡ Primary Productivity:</text>
        <text x="140" y="0" class="val-text">Afternoon &amp; Evening Sprints</text>

        <text x="0" y="22" class="label-text">🌐 Timezone Context:</text>
        <text x="140" y="22" class="val-text">Asia/Ho_Chi_Minh (UTC+7)</text>
    </g>

    <!-- Footer -->
    <text x="464" y="244" class="footer-text" text-anchor="end">Telemetry based on repository commit timestamps</text>
</svg>
