<svg xmlns="http://www.w3.org/2000/svg" width="450" height="90" viewBox="0 0 450 90" fill="none">
  <defs>
    <linearGradient id="cyber_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="neon_bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <style>
      @keyframes bar1 { 0%, 100% { height: 8px; y: 44px; } 50% { height: 28px; y: 24px; } }
      @keyframes bar2 { 0%, 100% { height: 24px; y: 28px; } 50% { height: 10px; y: 42px; } }
      @keyframes bar3 { 0%, 100% { height: 14px; y: 38px; } 50% { height: 32px; y: 20px; } }
      @keyframes bar4 { 0%, 100% { height: 30px; y: 22px; } 50% { height: 12px; y: 40px; } }
      @keyframes bar5 { 0%, 100% { height: 18px; y: 34px; } 50% { height: 26px; y: 26px; } }
      .b1 { animation: bar1 1.2s ease-in-out infinite; }
      .b2 { animation: bar2 0.9s ease-in-out infinite 0.2s; }
      .b3 { animation: bar3 1.4s ease-in-out infinite 0.4s; }
      .b4 { animation: bar4 1.0s ease-in-out infinite 0.1s; }
      .b5 { animation: bar5 1.3s ease-in-out infinite 0.3s; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #00e5ff; letter-spacing: 1px; }
      .track { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
      .artist { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Border & Background -->
  <rect x="1" y="1" width="448" height="88" rx="10" fill="url(#cyber_grad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="2" y="2" width="4" height="86" rx="2" fill="#00e5ff" opacity="0.8" />

  <!-- Spotify Icon -->
  <g transform="translate(18, 22)">
    <circle cx="23" cy="23" r="22" fill="#1DB954" />
    <path d="M33.8 28.5c-.4 0-.8-.1-1.1-.3-4.2-2.6-9.6-3.2-15.9-1.7-.8.2-1.6-.3-1.8-1.1-.2-.8.3-1.6 1.1-1.8 7.1-1.6 13.1-.9 17.9 2 0.7.4 1 1.3.5 2-.2.6-.7.9-.7.9zm2.4-5.3c-.5 0-1-.2-1.4-.5-5.3-3.2-13.4-4.2-19.7-2.3-.9.3-1.9-.3-2.1-1.2-.3-.9.3-1.9 1.2-2.1 7.2-2.2 16.2-1.1 22.3 2.6.8.5 1.1 1.6.6 2.4-.4.7-1.1 1.1-1.9 1.1zm.2-5.4c-.6 0-1.1-.2-1.6-.5-6.2-3.7-16.5-4.1-22.5-2.2-1.1.3-2.3-.3-2.6-1.5-.3-1.1.3-2.3 1.5-2.6 7.1-2.2 18.4-1.7 25.6 2.6 1 .6 1.3 1.9.7 2.9-.5.8-1.3 1.3-2.1 1.3z" fill="#000000" />
  </g>

  <!-- Track Info -->
  <text x="75" y="30" class="title">AUDIO TELEMETRY // STREAM ACTIVE</text>
  <text x="75" y="52" class="track">Synthwave &amp; Cyberpunk Lo-Fi Beats</text>
  <text x="75" y="70" class="artist">Spotify • Deep Focus Coding Session</text>

  <!-- Animated Equalizer Bars -->
  <g transform="translate(370, 10)">
    <rect class="b1" x="0" y="30" width="5" height="15" rx="2.5" fill="url(#neon_bar)" />
    <rect class="b2" x="9" y="30" width="5" height="15" rx="2.5" fill="url(#neon_bar)" />
    <rect class="b3" x="18" y="30" width="5" height="15" rx="2.5" fill="url(#neon_bar)" />
    <rect class="b4" x="27" y="30" width="5" height="15" rx="2.5" fill="url(#neon_bar)" />
    <rect class="b5" x="36" y="30" width="5" height="15" rx="2.5" fill="url(#neon_bar)" />
  </g>
</svg>
